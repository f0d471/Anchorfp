<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="LUT count before and after the bit-equivalent area recovery pass, at three scopes">
<style>
  .s{fill:#fcfcfb}
  .t1{fill:#0b0b0b}
  .t2{fill:#52514e}
  .t3{fill:#77756f}
  .base{stroke:#c9c7c1;stroke-width:1}
  .frame{fill:none;stroke:#e7e6e2;stroke-width:1}
  .panel{fill:none;stroke:#e7e6e2;stroke-width:1}
  .b1{fill:#2a78d6}
  .b2{fill:#eb6834}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .s{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .t3{fill:#8f8d85}
    .base{stroke:#3d3c39} .frame{stroke:#2e2e2c} .panel{stroke:#2e2e2c}
    .b1{fill:#3987e5} .b2{fill:#d95926}
  }
</style>
<rect class="s" x="0" y="0" width="880" height="430" rx="8"/>
<rect class="frame" x="0.5" y="0.5" width="879" height="429" rx="8"/>

<text class="t1" x="32" y="40" font-size="17" font-weight="600">Area recovered without touching the structure</text>
<text class="t2" x="32" y="62" font-size="12.5">Four bit-equivalent rewrites: narrower pipeline register, reset off the data path twice, two-level leading-zero count.</text>

<g font-size="12">
  <rect class="b2" x="660" y="32" width="11" height="11" rx="2"/>
  <text class="t2" x="677" y="42">before</text>
  <rect class="b1" x="740" y="32" width="11" height="11" rx="2"/>
  <text class="t2" x="757" y="42">after</text>
</g>

<!-- panel A -->
<rect class="panel" x="32" y="92" width="256" height="260" rx="8"/>
<text class="t1" x="52" y="118" font-size="13" font-weight="600">One lane, out of context</text>
<text class="t3" x="52" y="136" font-size="11">fp32_mac_unit, LUT</text>
<rect class="b2" x="94" y="170" width="56" height="150" rx="4"/><rect class="b2" x="94" y="314" width="56" height="6"/>
<rect class="b1" x="182" y="190" width="56" height="130" rx="4"/><rect class="b1" x="182" y="314" width="56" height="6"/>
<text class="t1" x="122" y="162" font-size="12.5" font-weight="600" text-anchor="middle">1470</text>
<text class="t1" x="210" y="182" font-size="12.5" font-weight="600" text-anchor="middle">1275</text>
<line class="base" x1="52" y1="320" x2="268" y2="320"/>
<text class="t1" x="160" y="344" font-size="13" font-weight="600" text-anchor="middle">-13.3%</text>

<!-- panel B -->
<rect class="panel" x="312" y="92" width="256" height="260" rx="8"/>
<text class="t1" x="332" y="118" font-size="13" font-weight="600">32 lanes instantiated</text>
<text class="t3" x="332" y="136" font-size="11">MAC array, LUT</text>
<rect class="b2" x="374" y="170" width="56" height="150" rx="4"/><rect class="b2" x="374" y="314" width="56" height="6"/>
<rect class="b1" x="462" y="196" width="56" height="124" rx="4"/><rect class="b1" x="462" y="314" width="56" height="6"/>
<text class="t1" x="402" y="162" font-size="12.5" font-weight="600" text-anchor="middle">39781</text>
<text class="t1" x="490" y="188" font-size="12.5" font-weight="600" text-anchor="middle">32906</text>
<line class="base" x1="332" y1="320" x2="548" y2="320"/>
<text class="t1" x="440" y="344" font-size="13" font-weight="600" text-anchor="middle">-17.3%</text>

<!-- panel C -->
<rect class="panel" x="592" y="92" width="256" height="260" rx="8"/>
<text class="t1" x="612" y="118" font-size="13" font-weight="600">Full design</text>
<text class="t3" x="612" y="136" font-size="11">xc7a200t, LUT</text>
<rect class="b2" x="654" y="170" width="56" height="150" rx="4"/><rect class="b2" x="654" y="314" width="56" height="6"/>
<rect class="b1" x="742" y="183" width="56" height="137" rx="4"/><rect class="b1" x="742" y="314" width="56" height="6"/>
<text class="t1" x="682" y="162" font-size="12.5" font-weight="600" text-anchor="middle">81729</text>
<text class="t1" x="770" y="175" font-size="12.5" font-weight="600" text-anchor="middle">74667</text>
<line class="base" x1="612" y1="320" x2="828" y2="320"/>
<text class="t1" x="720" y="344" font-size="13" font-weight="600" text-anchor="middle">-8.6%</text>

<line class="base" x1="32" y1="376" x2="848" y2="376"/>
<text class="t3" x="32" y="396" font-size="11.5">Per lane the flip-flop count drops with it (561 to 495) and the critical path does not get worse (18 logic levels to 17). Every</text>
<text class="t3" x="32" y="414" font-size="11.5">testbench output is bit-identical before and after, which is the only reason these rewrites are allowed to be called free.</text>
</svg>
