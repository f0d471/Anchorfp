<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Cycles per FP32 operation, software emulation versus this FPU, measured on board">
<style>
  .s{fill:#fcfcfb}
  .t1{fill:#0b0b0b}
  .t2{fill:#52514e}
  .t3{fill:#77756f}
  .grid{stroke:#e7e6e2;stroke-width:1}
  .axis{stroke:#c9c7c1;stroke-width:1}
  .b1{fill:#2a78d6}
  .b2{fill:#eb6834}
  .frame{fill:none;stroke:#e7e6e2;stroke-width:1}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-color-scheme: dark){
    .s{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .t3{fill:#8f8d85}
    .grid{stroke:#2e2e2c} .axis{stroke:#3d3c39} .frame{stroke:#2e2e2c}
    .b1{fill:#3987e5} .b2{fill:#d95926}
  }
</style>
<rect class="s" x="0" y="0" width="880" height="470" rx="8"/>
<rect class="frame" x="0.5" y="0.5" width="879" height="469" rx="8"/>

<text class="t1" x="32" y="40" font-size="17" font-weight="600">Cost per FP32 operation</text>
<text class="t2" x="32" y="62" font-size="12.5">Cycles per call, tight-loop probe minus empty-loop baseline. LA32R soft core, 50 MHz, Artix-7.</text>

<g font-size="12">
  <rect class="b2" x="628" y="32" width="11" height="11" rx="2"/>
  <text class="t2" x="645" y="42">libgcc soft float</text>
  <rect class="b1" x="758" y="32" width="11" height="11" rx="2"/>
  <text class="t2" x="775" y="42">Anchorfp</text>
</g>

<g class="grid">
  <line x1="190" y1="104" x2="190" y2="404"/>
  <line x1="292" y1="104" x2="292" y2="404"/>
  <line x1="394" y1="104" x2="394" y2="404"/>
  <line x1="495" y1="104" x2="495" y2="404"/>
  <line x1="597" y1="104" x2="597" y2="404"/>
  <line x1="699" y1="104" x2="699" y2="404"/>
</g>
<g font-size="11" text-anchor="middle">
  <text class="t3" x="190" y="96">0</text>
  <text class="t3" x="292" y="96">50</text>
  <text class="t3" x="394" y="96">100</text>
  <text class="t3" x="495" y="96">150</text>
  <text class="t3" x="597" y="96">200</text>
  <text class="t3" x="699" y="96">250 cycles</text>
  <text class="t3" x="820" y="96">speedup</text>
</g>

<!-- row 1: mul -->
<text class="t1" x="180" y="126" font-size="12.5" text-anchor="end">__mulsf3</text>
<rect class="b2" x="190" y="112" width="268" height="13" rx="4"/><rect class="b2" x="190" y="112" width="6" height="13"/>
<text class="t2" x="466" y="122" font-size="11.5">131.45</text>
<rect class="b1" x="190" y="129" width="10" height="13" rx="4"/><rect class="b1" x="190" y="129" width="6" height="13"/>
<text class="t2" x="208" y="139" font-size="11.5">4.99</text>
<text class="t1" x="848" y="131" font-size="12.5" font-weight="600" text-anchor="end">26.3×</text>

<!-- row 2: add -->
<text class="t1" x="180" y="166" font-size="12.5" text-anchor="end">__addsf3</text>
<rect class="b2" x="190" y="152" width="166" height="13" rx="4"/><rect class="b2" x="190" y="152" width="6" height="13"/>
<text class="t2" x="364" y="162" font-size="11.5">81.52</text>
<rect class="b1" x="190" y="169" width="12" height="13" rx="4"/><rect class="b1" x="190" y="169" width="6" height="13"/>
<text class="t2" x="210" y="179" font-size="11.5">5.99</text>
<text class="t1" x="848" y="171" font-size="12.5" font-weight="600" text-anchor="end">13.6×</text>

<!-- row 3: sub -->
<text class="t1" x="180" y="206" font-size="12.5" text-anchor="end">__subsf3</text>
<rect class="b2" x="190" y="192" width="181" height="13" rx="4"/><rect class="b2" x="190" y="192" width="6" height="13"/>
<text class="t2" x="379" y="202" font-size="11.5">88.96</text>
<rect class="b1" x="190" y="209" width="12" height="13" rx="4"/><rect class="b1" x="190" y="209" width="6" height="13"/>
<text class="t2" x="210" y="219" font-size="11.5">5.99</text>
<text class="t1" x="848" y="211" font-size="12.5" font-weight="600" text-anchor="end">14.9×</text>

<!-- row 4: cmp -->
<text class="t1" x="180" y="246" font-size="12.5" text-anchor="end">__ltsf2</text>
<rect class="b2" x="190" y="232" width="64" height="13" rx="4"/><rect class="b2" x="190" y="232" width="6" height="13"/>
<text class="t2" x="262" y="242" font-size="11.5">31.56</text>
<rect class="b1" x="190" y="249" width="12" height="13" rx="4"/><rect class="b1" x="190" y="249" width="6" height="13"/>
<text class="t2" x="210" y="259" font-size="11.5">5.99</text>
<text class="t1" x="848" y="251" font-size="12.5" font-weight="600" text-anchor="end">5.3×</text>

<!-- row 5: i2f -->
<text class="t1" x="180" y="286" font-size="12.5" text-anchor="end">__floatsisf</text>
<rect class="b2" x="190" y="272" width="113" height="13" rx="4"/><rect class="b2" x="190" y="272" width="6" height="13"/>
<text class="t2" x="311" y="282" font-size="11.5">55.76</text>
<rect class="b1" x="190" y="289" width="8" height="13" rx="4"/><rect class="b1" x="190" y="289" width="6" height="13"/>
<text class="t2" x="206" y="299" font-size="11.5">3.99</text>
<text class="t1" x="848" y="291" font-size="12.5" font-weight="600" text-anchor="end">14.0×</text>

<!-- row 6: f2i -->
<text class="t1" x="180" y="326" font-size="12.5" text-anchor="end">__fixsfsi</text>
<rect class="b2" x="190" y="312" width="57" height="13" rx="4"/><rect class="b2" x="190" y="312" width="6" height="13"/>
<text class="t2" x="255" y="322" font-size="11.5">27.93</text>
<rect class="b1" x="190" y="329" width="8" height="13" rx="4"/><rect class="b1" x="190" y="329" width="6" height="13"/>
<text class="t2" x="206" y="339" font-size="11.5">3.99</text>
<text class="t1" x="848" y="331" font-size="12.5" font-weight="600" text-anchor="end">7.0×</text>

<!-- row 7: div, deliberately not offloaded -->
<text class="t1" x="180" y="371" font-size="12.5" text-anchor="end">__divsf3</text>
<rect class="b2" x="190" y="357" width="533" height="13" rx="4"/><rect class="b2" x="190" y="357" width="6" height="13"/>
<text class="t2" x="731" y="367" font-size="11.5">261.64</text>
<text class="t3" x="192" y="390" font-size="11.5">stays in software by decision — IEEE requires a correctly-rounded quotient</text>
<text class="t1" x="848" y="371" font-size="12.5" font-weight="600" text-anchor="end">1.0×</text>

<line class="axis" x1="190" y1="104" x2="190" y2="404"/>
<line class="axis" x1="32" y1="424" x2="848" y2="424"/>
<text class="t3" x="32" y="446" font-size="11.5">Every number is a board measurement, not a synthesis estimate. Hardware costs are dominated by the blocking</text>
<text class="t3" x="32" y="461" font-size="11.5">coprocessor handshake: a 3-cycle adder is billed at 5.99 cycles per call. See docs/reports/01.</text>
</svg>
