<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Frame time of the 3D Gaussian splatting geometry stage as each floating point operation moves into hardware">
<style>
  .s{fill:#fcfcfb}
  .t1{fill:#0b0b0b}
  .t2{fill:#52514e}
  .t3{fill:#77756f}
  .grid{stroke:#e7e6e2;stroke-width:1}
  .base{stroke:#c9c7c1;stroke-width:1}
  .frame{fill:none;stroke:#e7e6e2;stroke-width:1}
  .b1{fill:#2a78d6}
  .b2{fill:#eb6834}
  .drop{stroke:#77756f;stroke-width:1;stroke-dasharray:3 3;fill:none}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .s{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .t3{fill:#8f8d85}
    .grid{stroke:#2e2e2c} .base{stroke:#3d3c39} .frame{stroke:#2e2e2c}
    .b1{fill:#3987e5} .b2{fill:#d95926} .drop{stroke:#8f8d85}
  }
</style>
<rect class="s" x="0" y="0" width="880" height="420" rx="8"/>
<rect class="frame" x="0.5" y="0.5" width="879" height="419" rx="8"/>

<text class="t1" x="32" y="40" font-size="17" font-weight="600">What it does to a real workload</text>
<text class="t2" x="32" y="62" font-size="12.5">Geometry stage of a 3D Gaussian splatting renderer: project every Gaussian to a screen-space ellipse. All floating point.</text>

<g class="grid">
  <line x1="70" y1="300" x2="830" y2="300"/>
  <line x1="70" y1="245" x2="830" y2="245"/>
  <line x1="70" y1="190" x2="830" y2="190"/>
  <line x1="70" y1="135" x2="830" y2="135"/>
  <line x1="70" y1="80" x2="830" y2="80"/>
</g>
<g class="t3" font-size="11" text-anchor="end">
  <text x="60" y="304">0</text>
  <text x="60" y="249">2.6k</text>
  <text x="60" y="194">5.3k</text>
  <text x="60" y="139">7.9k</text>
  <text x="60" y="84">10.6k ms</text>
</g>

<rect class="b2" x="80" y="80" width="70" height="220" rx="4"/><rect class="b2" x="80" y="294" width="70" height="6"/>
<rect class="b1" x="190" y="196" width="70" height="104" rx="4"/><rect class="b1" x="190" y="294" width="70" height="6"/>
<rect class="b1" x="300" y="245" width="70" height="55" rx="4"/><rect class="b1" x="300" y="294" width="70" height="6"/>
<rect class="b1" x="410" y="265" width="70" height="35" rx="4"/><rect class="b1" x="410" y="294" width="70" height="6"/>
<rect class="b1" x="520" y="270" width="70" height="30" rx="4"/><rect class="b1" x="520" y="294" width="70" height="6"/>
<rect class="b1" x="630" y="275" width="70" height="25" rx="4"/><rect class="b1" x="630" y="294" width="70" height="6"/>
<rect class="b1" x="740" y="276" width="70" height="24" rx="4"/><rect class="b1" x="740" y="294" width="70" height="6"/>

<g class="t1" font-size="12" font-weight="600" text-anchor="middle">
  <text x="115" y="72">10559</text>
  <text x="225" y="188">4976</text>
  <text x="335" y="237">2621</text>
  <text x="445" y="257">1662</text>
  <text x="555" y="262">1461</text>
  <text x="665" y="267">1193</text>
  <text x="775" y="268">1132</text>
</g>

<line class="base" x1="70" y1="300" x2="830" y2="300"/>

<g class="t2" font-size="11.5" text-anchor="middle">
  <text x="115" y="320">software</text>
  <text x="225" y="320">+ mul</text>
  <text x="335" y="320">+ add/sub</text>
  <text x="445" y="320">+ FTZ</text>
  <text x="555" y="320">+ compare</text>
  <text x="665" y="320">+ convert</text>
  <text x="775" y="320">+ rsqrt</text>
</g>
<g class="t3" font-size="10.5" text-anchor="middle">
  <text x="115" y="336">libgcc only</text>
  <text x="225" y="336">-52.9%</text>
  <text x="335" y="336">-47.3%</text>
  <text x="445" y="336">-36.6%</text>
  <text x="555" y="336">-12.1%</text>
  <text x="665" y="336">-18.3%</text>
  <text x="775" y="336">-5.1%</text>
</g>

<line class="base" x1="32" y1="360" x2="848" y2="360"/>
<text class="t1" x="32" y="384" font-size="12.5" font-weight="600">10559 ms to 1132 ms, -89.3% cumulative</text>
<text class="t3" x="330" y="384" font-size="11.5">— on board, same binary path, same renderer, one operation added per step.</text>
<text class="t3" x="32" y="406" font-size="11">Division was never offloaded; the remaining 47% of the stage is loop control, addressing and memory, which is why the line stops here.</text>
</svg>
