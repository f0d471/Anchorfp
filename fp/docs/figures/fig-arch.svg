<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Block diagram: scalar FP32 units and the windowed multiply-accumulate lane pipeline">
<style>
  .s{fill:#fcfcfb}
  .t1{fill:#0b0b0b}
  .t2{fill:#52514e}
  .t3{fill:#77756f}
  .frame{fill:none;stroke:#e7e6e2;stroke-width:1}
  .group{fill:none;stroke:#e7e6e2;stroke-width:1}
  .chip{fill:none;stroke:#c9c7c1;stroke-width:1}
  .stage{fill:none;stroke:#c9c7c1;stroke-width:1}
  .stagesel{fill:none;stroke:#2a78d6;stroke-width:2}
  .flow{stroke:#77756f;stroke-width:1.5;fill:none}
  .loop{stroke:#2a78d6;stroke-width:2;fill:none}
  .share{stroke:#eb6834;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
  .accent{fill:#2a78d6}
  .accent2{fill:#eb6834}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .s{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .t3{fill:#8f8d85}
    .frame{stroke:#2e2e2c} .group{stroke:#2e2e2c} .chip{stroke:#3d3c39} .stage{stroke:#3d3c39}
    .stagesel{stroke:#3987e5} .flow{stroke:#8f8d85} .loop{stroke:#3987e5} .share{stroke:#d95926}
    .accent{fill:#3987e5} .accent2{fill:#d95926}
  }
</style>
<rect class="s" x="0" y="0" width="880" height="470" rx="8"/>
<rect class="frame" x="0.5" y="0.5" width="879" height="469" rx="8"/>

<text class="t1" x="32" y="38" font-size="17" font-weight="600">Two datapaths, one contract</text>
<text class="t2" x="32" y="60" font-size="12.5">Scalar units answer one instruction at a time and are billed by latency. The MAC lane answers a tile and is billed by throughput.</text>

<!-- scalar row -->
<rect class="group" x="32" y="80" width="816" height="104" rx="8"/>
<text class="t1" x="48" y="102" font-size="12.5" font-weight="600">Scalar path</text>
<text class="t3" x="128" y="102" font-size="11">callers wait for the result, so latency is the price of the operation</text>

<rect class="chip" x="48" y="112" width="150" height="56" rx="6"/>
<text class="t1" x="123" y="136" font-size="12" text-anchor="middle">fp32_mul_pipe</text>
<text class="t3" x="123" y="154" font-size="11" text-anchor="middle">2 cycles · 2 DSP</text>

<rect class="chip" x="208" y="112" width="150" height="56" rx="6"/>
<text class="t1" x="283" y="136" font-size="12" text-anchor="middle">fp32_add</text>
<text class="t3" x="283" y="154" font-size="11" text-anchor="middle">3 cycles · 504 LUT</text>

<rect class="chip" x="368" y="112" width="150" height="56" rx="6"/>
<text class="t1" x="443" y="136" font-size="12" text-anchor="middle">fp32_cmp</text>
<text class="t3" x="443" y="154" font-size="11" text-anchor="middle">1 cycle · six predicates</text>

<rect class="chip" x="528" y="112" width="150" height="56" rx="6"/>
<text class="t1" x="603" y="136" font-size="12" text-anchor="middle">fp32_cvt</text>
<text class="t3" x="603" y="154" font-size="11" text-anchor="middle">1 cycle · saturating</text>

<rect class="chip" x="688" y="112" width="150" height="56" rx="6"/>
<text class="t1" x="763" y="136" font-size="12" text-anchor="middle">fp32_recip</text>
<text class="t3" x="763" y="154" font-size="11" text-anchor="middle">5 cycles · 4 ULP</text>

<!-- MAC row -->
<rect class="group" x="32" y="204" width="816" height="200" rx="8"/>
<text class="t1" x="48" y="228" font-size="12.5" font-weight="600">MAC lane</text>
<text class="t3" x="118" y="228" font-size="11">fp32_mac_unit — one term in per cycle</text>

<g font-size="11" text-anchor="middle">
  <rect class="stage" x="44" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="92" y="278" font-size="11.5">multiply</text>
  <text class="t3" x="92" y="296">48-bit product</text>
  <text class="t3" x="92" y="311">not rounded</text>

  <rect class="stage" x="154" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="202" y="278" font-size="11.5">anchor</text>
  <text class="t3" x="202" y="296">base follows</text>
  <text class="t3" x="202" y="311">the largest term</text>

  <rect class="stage" x="264" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="312" y="278" font-size="11.5">align</text>
  <text class="t3" x="312" y="296">barrel shift</text>
  <text class="t3" x="312" y="311">two's cpl</text>

  <rect class="stagesel" x="374" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="422" y="278" font-size="11.5">accumulate</text>
  <text class="t3" x="422" y="296">88-bit window</text>
  <text class="t3" x="422" y="311">no rounding</text>

  <rect class="stage" x="484" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="532" y="278" font-size="11.5">magnitude</text>
  <text class="t3" x="532" y="296">two-level</text>
  <text class="t3" x="532" y="311">leading zeros</text>

  <rect class="stage" x="594" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="642" y="278" font-size="11.5">normalize</text>
  <text class="t3" x="642" y="296">shift by lz</text>
  <text class="t3" x="642" y="311">same shifter</text>

  <rect class="stage" x="704" y="252" width="96" height="72" rx="6"/>
  <text class="t1" x="752" y="278" font-size="11.5">round</text>
  <text class="t3" x="752" y="296">once per tile</text>
  <text class="t3" x="752" y="311">nearest even</text>
</g>

<g class="flow">
  <path d="M140 288 h14"/><path d="M250 288 h14"/><path d="M360 288 h14"/>
  <path d="M470 288 h14"/><path d="M580 288 h14"/><path d="M690 288 h14"/>
  <path d="M800 288 h26"/>
</g>
<text class="t2" x="816" y="272" font-size="11" text-anchor="middle">FP32 out</text>

<!-- accumulate loop -->
<path class="loop" d="M446 252 v-14 h-48 v14"/>
<text class="accent" x="456" y="243" font-size="11" font-weight="600">II = 1</text>

<!-- shared shifter bracket -->
<path class="share" d="M312 324 v22 h330 v-22"/>
<text class="accent2" x="477" y="362" font-size="11" text-anchor="middle" font-weight="600">one barrel shifter, shared by both stages</text>
<text class="t3" x="477" y="378" font-size="10.5" text-anchor="middle">splitting it into two dedicated shifters was measured and costs 28 more LUT</text>

<text class="t3" x="32" y="428" font-size="11.5">Last term in to result out: 7 cycles. Terms may arrive back to back — the feedback loop is one cycle deep, so nothing throttles the array.</text>
<text class="t3" x="32" y="448" font-size="11.5">This is one lane. An array instantiates one lane per dot product computed in parallel.</text>
</svg>
