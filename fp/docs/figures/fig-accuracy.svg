<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Maximum ULP error of a dot product versus K, windowed accumulator compared with per-term IEEE rounding">
<style>
  .s{fill:#fcfcfb}
  .t1{fill:#0b0b0b}
  .t2{fill:#52514e}
  .t3{fill:#77756f}
  .grid{stroke:#e7e6e2;stroke-width:1}
  .axis{stroke:#c9c7c1;stroke-width:1}
  .l1{stroke:#2a78d6;stroke-width:2;fill:none}
  .l2{stroke:#eb6834;stroke-width:2;fill:none}
  .m1{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2}
  .m2{fill:#eb6834;stroke:#fcfcfb;stroke-width:2}
  .sw1{fill:#2a78d6}
  .sw2{fill:#eb6834}
  .frame{fill:none;stroke:#e7e6e2;stroke-width:1}
  .note{fill:none;stroke:#c9c7c1;stroke-width:1;stroke-dasharray:3 3}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .s{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .t3{fill:#8f8d85}
    .grid{stroke:#2e2e2c} .axis{stroke:#3d3c39} .frame{stroke:#2e2e2c} .note{stroke:#3d3c39}
    .l1{stroke:#3987e5} .l2{stroke:#d95926}
    .m1{fill:#3987e5;stroke:#1a1a19} .m2{fill:#d95926;stroke:#1a1a19}
    .sw1{fill:#3987e5} .sw2{fill:#d95926}
  }
</style>
<rect class="s" x="0" y="0" width="880" height="430" rx="8"/>
<rect class="frame" x="0.5" y="0.5" width="879" height="429" rx="8"/>

<text class="t1" x="32" y="40" font-size="17" font-weight="600">Dot-product error against an infinite-precision reference</text>
<text class="t2" x="32" y="62" font-size="12.5">Maximum ULP over 200 random dot products per point. Tile depth fixed at 64; K is the full reduction length.</text>

<g font-size="12">
  <rect class="sw2" x="580" y="32" width="11" height="11" rx="2"/>
  <text class="t2" x="597" y="42">per-term IEEE rounding</text>
  <rect class="sw1" x="748" y="32" width="11" height="11" rx="2"/>
  <text class="t2" x="765" y="42">Anchorfp window</text>
</g>

<g class="grid">
  <line x1="110" y1="340" x2="800" y2="340"/>
  <line x1="110" y1="277.5" x2="800" y2="277.5"/>
  <line x1="110" y1="215" x2="800" y2="215"/>
  <line x1="110" y1="152.5" x2="800" y2="152.5"/>
  <line x1="110" y1="90" x2="800" y2="90"/>
</g>
<g class="t3" font-size="11" text-anchor="end">
  <text x="98" y="344">0</text>
  <text x="98" y="281.5">150</text>
  <text x="98" y="219">300</text>
  <text x="98" y="156.5">450</text>
  <text x="98" y="94">600</text>
</g>
<text class="t2" x="32" y="86" font-size="11.5">max ULP</text>

<line class="axis" x1="110" y1="90" x2="110" y2="340"/>
<g class="t2" font-size="12" text-anchor="middle">
  <text x="190" y="364">K = 64</text>
  <text x="380" y="364">K = 128</text>
  <text x="570" y="364">K = 256</text>
  <text x="760" y="364">K = 512</text>
</g>
<g class="t3" font-size="11" text-anchor="middle">
  <text x="190" y="380">1 tile</text>
  <text x="380" y="380">2 tiles</text>
  <text x="570" y="380">4 tiles</text>
  <text x="760" y="380">8 tiles</text>
</g>

<polyline class="l2" points="190,198.7 380,304.6 570,295 760,112.5"/>
<polyline class="l1" points="190,340 380,336.7 570,333.3 760,299.6"/>

<circle class="m2" cx="190" cy="198.7" r="4.5"/>
<circle class="m2" cx="380" cy="304.6" r="4.5"/>
<circle class="m2" cx="570" cy="295" r="4.5"/>
<circle class="m2" cx="760" cy="112.5" r="4.5"/>
<circle class="m1" cx="190" cy="340" r="4.5"/>
<circle class="m1" cx="380" cy="336.7" r="4.5"/>
<circle class="m1" cx="570" cy="333.3" r="4.5"/>
<circle class="m1" cx="760" cy="299.6" r="4.5"/>

<g class="t1" font-size="11.5" font-weight="600" text-anchor="middle">
  <text x="190" y="190">339</text>
  <text x="380" y="296">85</text>
  <text x="570" y="286">108</text>
  <text x="760" y="104">546</text>
</g>
<g class="t1" font-size="11.5" font-weight="600" text-anchor="middle">
  <text x="190" y="328">0</text>
  <text x="404" y="331">8</text>
  <text x="594" y="328">16</text>
  <text x="760" y="292">97</text>
</g>

<rect class="note" x="168" y="108" width="352" height="52" rx="6"/>
<text class="t2" x="182" y="128" font-size="11.5">Inside one tile the window is exact: it rounds once, at the end.</text>
<text class="t2" x="182" y="146" font-size="11.5">What grows with K is the FP32 partial sum handed between tiles.</text>

<line class="axis" x1="32" y1="396" x2="848" y2="396"/>
<text class="t3" x="32" y="416" font-size="11.5">Reproduce: bash fp/sim/run_mac_audit.sh. The baseline is the same reduction order in FP32, so the gap is the accumulator alone, not a reordering effect.</text>
</svg>
